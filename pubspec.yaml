name: billingapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.7
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.8.0
  file_picker: ^8.1.4
  intl: ^0.19.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  open_file: ^3.5.11
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  mobile_scanner: ^7.2.0

  provider: ^6.1.2
  flutter_screenutil: ^5.9.3
  pattern_lock: ^2.0.0
  dio: ^5.7.0
  local_auth: ^2.3.0
  uuid: ^4.5.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.2
  mailer: ^6.2.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/captcha/

flutter_native_splash:
  color: "#ffffff"
  image: assets/images.png
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill

  android_12:
    image: assets/images.png
    color: "#ffffff"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images.png"